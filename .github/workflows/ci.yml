name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run demo
  openid-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hewlbern/openID
          path: openID
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Start OpenID server
        run: |
          cd openID && go build -o /tmp/openid ./cmd/server
          /tmp/openid -port 3000 -storage /tmp/oid &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
      - run: npm run test:integration
        env:
          OPENID_BASE_URL: http://localhost:3000
